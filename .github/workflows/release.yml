name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    # fork 只在自己的仓库发版，别去碰上游的 Releases
    if: github.repository == '37-oss/dsh-purge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 发版前全量校验（语法 + 结构测试）
        run: npm run verify

      - name: Syntax-check plugin entry
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --input-type=module -e "import './lib/index.js'"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "already published: $tag"
            exit 0
          fi
          first="$(head -n 1 release-notes.md | tr -d '\r')"
          if [ "$first" != "# ${version}" ]; then
            echo "release-notes.md 第一行必须是 # ${version}，现在是: ${first}"
            exit 1
          fi
          zip="dsh-purge-${version}.zip"
          tgz="dsh-purge-${version}.tar.gz"
          prefix="dsh-purge-${version}/"
          # .zip 给手动下载，.tar.gz 给 dsh plugin add <tarball> 用（它只收 tgz/tar.gz）
          if git rev-parse -q --verify "refs/tags/${tag}^{}" >/dev/null; then
            ref="$(git rev-parse "refs/tags/${tag}^{}")"
            git archive --format=zip --prefix="$prefix" --output="$zip" "$ref"
            git archive --format=tar.gz --prefix="$prefix" --output="$tgz" "$ref"
            gh release create "$tag" --title "$tag" --notes-file release-notes.md
          else
            git archive --format=zip --prefix="$prefix" --output="$zip" HEAD
            git archive --format=tar.gz --prefix="$prefix" --output="$tgz" HEAD
            args=(release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md)
            case "$version" in
              *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
            esac
            gh "${args[@]}"
          fi
          test -s "$zip" && test -s "$tgz"
          gh release upload "$tag" "$zip" "$tgz" --clobber
          echo "published https://github.com/37-oss/dsh-purge/releases/tag/${tag}"
